name: Build and Test

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK Platform 37.0
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
          "$SDKMGR" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Prepare release signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$RELEASE_KEYSTORE_PASSWORD" ] && [ -n "$RELEASE_KEY_ALIAS" ] && [ -n "$RELEASE_KEY_PASSWORD" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/release-keystore.jks"
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            {
              echo "RELEASE_STORE_FILE=$KEYSTORE_PATH"
              echo "RELEASE_STORE_PASSWORD=$RELEASE_KEYSTORE_PASSWORD"
              echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
              echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
              echo "HAS_RELEASE_SIGNING=true"
            } >> "$GITHUB_ENV"
          else
            echo "HAS_RELEASE_SIGNING=false" >> "$GITHUB_ENV"
          fi

      - name: Run JVM unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Assemble release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signed release APK
        if: env.HAS_RELEASE_SIGNING == 'true'
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK_ROOT/build-tools/37.0.0/apksigner"
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_PATH"
          "$APKSIGNER" verify --verbose "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Swipe-Gesture-debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload signed release APK artifact
        if: env.HAS_RELEASE_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Swipe-Gesture-release
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$HAS_RELEASE_SIGNING" != "true" ]; then
            echo "Release signing secrets are missing; refusing to publish an unsigned release." >&2
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          SRC_APK="app/build/outputs/apk/release/app-release.apk"
          OUT_APK="$RUNNER_TEMP/HyperOS-Swipe-Gesture-${TAG}.apk"
          cp "$SRC_APK" "$OUT_APK"

          TAG_SUBJECT="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          TAG_BODY="$(git for-each-ref --format='%(contents:body)' "refs/tags/$TAG")"
          TITLE="${TAG_SUBJECT:-$TAG}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$OUT_APK" --clobber
          elif [ -n "${TAG_BODY//[$' \t\r\n']/}" ]; then
            NOTES_FILE="$RUNNER_TEMP/release-notes.md"
            printf '%s\n' "$TAG_BODY" > "$NOTES_FILE"
            gh release create "$TAG" "$OUT_APK" --title "$TITLE" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" "$OUT_APK" --title "$TITLE" --generate-notes
          fi
